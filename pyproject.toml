[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boltz-studio"
version = "0.2.0"
requires-python = ">=3.11"
description = "Web UI for protein structure prediction and binder design using Boltz"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "websockets>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
    "httpx>=0.24.0",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "email-validator>=2.0",
    "biopython>=1.80",
    "boltzgen>=0.2.0",
    "sse-starlette>=1.6.0",
]

[project.scripts]
boltz-studio = "boltz_studio.main:main"

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio", "pytest-mock", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["boltz_studio*"]

[tool.setuptools.package-data]
boltz_studio = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
